<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0e1014" />
  <title>本站后台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>" />
  <link rel="stylesheet" href="/admin/admin.css?v=1.3.2" />
</head>
<body>

<!-- 没登录时只看得到这个 -->
<section class="gate" id="gate">
  <form class="gate-card" id="loginForm" autocomplete="off">
    <h1 class="gate-title">后台</h1>
    <p class="gate-sub">要管理密钥。密钥在这台机器的 <code>admin.key</code> 里。</p>
    <input class="input" id="keyInput" type="password" placeholder="管理密钥" autocomplete="current-password" />
    <button class="btn btn-primary btn-block" id="loginBtn" type="submit">进去</button>
    <p class="hint" id="loginHint"></p>
  </form>
</section>

<!-- 登录之后 -->
<section class="dash" id="dash" hidden>
  <header class="bar">
    <div class="bar-left">
      <strong>后台</strong>
      <span class="bar-sub">这里只有你看得到</span>
    </div>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">退出</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="panel-head">
      <h2>正在玩的房间</h2>
      <span class="panel-note">排行榜以外的东西都不显示：炸弹数字、密码、画像原图，这里都没有</span>
    </div>
    <div class="rooms" id="rooms"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>账号</h2>
      <div class="search">
        <input class="input input-sm" id="searchInput" type="search" placeholder="搜名字" />
        <button class="btn btn-ghost btn-sm" id="refreshBtn" type="button">刷新</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th class="col-id">#</th>
            <th>名字</th>
            <th class="col-num">积分</th>
            <th class="col-avatar">头像</th>
            <th class="col-time">来的时间</th>
            <th class="col-time">最后登录</th>
            <th class="col-act">改分 / 删号</th>
          </tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>
    <div class="pager">
      <button class="btn btn-ghost btn-sm" id="prevBtn" type="button">上一页</button>
      <span class="pager-info" id="pagerInfo"></span>
      <button class="btn btn-ghost btn-sm" id="nextBtn" type="button">下一页</button>
    </div>
  </div>

  <p class="foot-note" id="footNote"></p>
</section>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/admin/admin.js?v=1.3.2"></script>
</body>
</html>
